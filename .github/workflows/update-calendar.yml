
name: Update Treasury Calendar

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treasury-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)

      - name: Test calendar
        run: python -m unittest -v

      - name: Generate Treasury calendar
        run: python treasury_calendar.py

      - name: Publish calendar
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add dates.json treasury.ics
          if git diff --cached --quiet; then
            echo 'No calendar changes.'
            exit 0
          fi
          git commit -m 'Update Treasury calendar'
          git push
